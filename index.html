<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010603">
<title>KRYVON — Cyber Dimension</title>
<style>
:root{--green:#39ff68}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#010603}
.world{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;isolation:isolate;background:#010603}
.hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;display:block;z-index:0;transform:scale(1.18);filter:brightness(.78) contrast(1.12) saturate(1.18);animation:enter 4.2s cubic-bezier(.16,1,.3,1) both,deepZoom 26s ease-in-out 4.2s infinite alternate;will-change:transform,filter}
.fog{position:absolute;inset:-18%;z-index:2;pointer-events:none;mix-blend-mode:screen;filter:blur(28px);opacity:.7}
.fog:before,.fog:after{content:"";position:absolute;inset:0;background:
 radial-gradient(ellipse at 16% 62%,rgba(23,255,75,.34) 0%,transparent 31%),
 radial-gradient(ellipse at 76% 54%,rgba(23,255,75,.28) 0%,transparent 34%),
 radial-gradient(ellipse at 52% 82%,rgba(95,255,125,.2) 0%,transparent 36%);}
.fog:before{animation:fogA 11s ease-in-out infinite alternate}
.fog:after{opacity:.7;filter:blur(18px);transform:scale(1.12);animation:fogB 15s ease-in-out infinite alternate}
.code{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.3;mix-blend-mode:screen}
#rain{width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;z-index:4;pointer-events:none;background:
 linear-gradient(180deg,rgba(0,0,0,.2),transparent 20%,transparent 76%,rgba(0,0,0,.3)),
 radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.42) 100%)}
.scan{position:absolute;z-index:5;left:0;top:-30%;width:100%;height:24%;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(85,255,125,.1),transparent);animation:scan 9s linear infinite}
.flash{position:absolute;z-index:6;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(35,255,80,.12),transparent 55%);animation:breath 5s ease-in-out infinite alternate}
@keyframes enter{0%{opacity:0;filter:blur(26px) brightness(.2) contrast(1.1);transform:scale(1.55)}55%{opacity:1;filter:blur(4px) brightness(.68) contrast(1.12)}100%{opacity:1;filter:blur(0) brightness(.78) contrast(1.12);transform:scale(1.18)}}
@keyframes deepZoom{from{transform:scale(1.18) translate3d(0,0,0)}to{transform:scale(1.34) translate3d(0,-1.2%,0)}}
@keyframes fogA{0%{transform:translate3d(-7%,3%,0) scale(.94)}100%{transform:translate3d(8%,-4%,0) scale(1.18)}}
@keyframes fogB{0%{transform:translate3d(8%,-2%,0) scale(1.08)}100%{transform:translate3d(-9%,5%,0) scale(.96)}}
@keyframes scan{from{top:-30%}to{top:110%}}
@keyframes breath{from{opacity:.25}to{opacity:.85}}
@media(min-width:700px){.hero{object-position:center 48%}}
@media(prefers-reduced-motion:reduce){.hero,.fog:before,.fog:after,.scan,.flash{animation:none}}
</style>
</head>
<body>
<main class="world">
 <img class="hero" src="./scene-mobile.webp" alt="Hooded hacker surrounded by green cyber light">
 <div class="fog"></div>
 <div class="code"><canvas id="rain"></canvas></div>
 <div class="shade"></div>
 <div class="scan"></div>
 <div class="flash"></div>
</main>
<script>
(()=>{
 const c=document.getElementById('rain'),x=c.getContext('2d');
 let w=0,h=0,drops=[],font=15,cols=0;
 const chars='01アイウエオカキクケコサシスセソタチツテト<>/{}[]#$%';
 function resize(){
  const d=Math.min(devicePixelRatio||1,2);
  w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);
  font=Math.max(12,Math.min(17,w/24));cols=Math.ceil(w/(font*1.7));
  drops=Array.from({length:cols},()=>Math.random()*-h/font);
 }
 function draw(){
  x.clearRect(0,0,w,h);x.font=`${font}px monospace`;
  for(let i=0;i<drops.length;i++){
   const y=drops[i]*font, ch=chars[(Math.random()*chars.length)|0];
   x.fillStyle=Math.random()>.94?'rgba(190,255,205,.9)':'rgba(45,255,95,.52)';
   x.shadowColor='#00ff4c';x.shadowBlur=8;x.fillText(ch,i*font*1.7,y);x.shadowBlur=0;
   drops[i]+=.35+Math.random()*.6;if(y>h&&Math.random()>.975)drops[i]=Math.random()*-18;
  }
  requestAnimationFrame(draw);
 }
 addEventListener('resize',resize,{passive:true});resize();draw();
})();
</script>
</body>
</html>
