<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020805">
<title>KRYVON — Enter the Cyber Dimension</title>
<style>
:root{--green:#39ff68;--deep:#020805}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--deep)}
body{font-family:ui-monospace,monospace}
.world{position:fixed;inset:0;overflow:hidden;isolation:isolate;background:#020805}
.backdrop{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(22px) brightness(.24) saturate(1.5);transform:scale(1.12);animation:backdropMove 28s ease-in-out infinite alternate}
.art-frame{position:absolute;z-index:2;left:0;top:50%;width:100%;transform:translateY(-50%);overflow:visible;animation:arrival 3.8s cubic-bezier(.16,1,.3,1) both}
.art{display:block;width:100%;height:auto;object-fit:contain;filter:contrast(1.08) saturate(1.12);animation:slowZoom 22s ease-in-out 3.8s infinite alternate;box-shadow:0 0 65px rgba(0,255,65,.16)}
.edge-fade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,#020805 0%,rgba(2,8,5,.7) 12%,transparent 29%,transparent 67%,rgba(2,8,5,.6) 86%,#020805 100%),radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.48) 100%)}
.fog{position:absolute;z-index:4;inset:25% -30% 12%;pointer-events:none;opacity:.5;filter:blur(24px);background:
 radial-gradient(ellipse at 18% 62%,rgba(25,255,78,.26),transparent 34%),
 radial-gradient(ellipse at 78% 54%,rgba(25,255,78,.22),transparent 35%),
 radial-gradient(ellipse at 50% 76%,rgba(80,255,120,.18),transparent 40%);
animation:fogDrift 12s ease-in-out infinite alternate}
.matrix{position:absolute;z-index:5;inset:0;pointer-events:none;overflow:hidden;opacity:.58}
.matrix canvas{display:block;width:100%;height:100%}
.dimension{position:absolute;z-index:1;inset:0;pointer-events:none;perspective:420px;overflow:hidden}
.grid-floor{position:absolute;left:-35%;right:-35%;bottom:-22%;height:48%;transform:rotateX(67deg);transform-origin:50% 100%;background-image:linear-gradient(rgba(28,255,78,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(28,255,78,.22) 1px,transparent 1px);background-size:42px 34px;mask-image:linear-gradient(to top,transparent,black 30%,transparent 96%);animation:gridMove 7s linear infinite}
.ring{position:absolute;left:50%;top:50%;width:76vw;height:76vw;max-width:620px;max-height:620px;border:1px solid rgba(55,255,100,.13);border-radius:50%;transform:translate(-50%,-50%) rotateX(68deg);box-shadow:0 0 35px rgba(0,255,60,.12),inset 0 0 35px rgba(0,255,60,.08);animation:ringPulse 6s ease-in-out infinite}
.scan{position:absolute;z-index:6;inset:-30% 0 auto;height:28%;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(85,255,125,.08),transparent);animation:scan 8s linear infinite}
.vignette{position:absolute;z-index:7;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(0,0,0,.75)}
@keyframes arrival{0%{opacity:0;filter:blur(22px);transform:translateY(-50%) scale(1.32)}55%{opacity:1;filter:blur(2px)}100%{opacity:1;filter:blur(0);transform:translateY(-50%) scale(1)}}
@keyframes slowZoom{from{transform:scale(1)}to{transform:scale(1.13)}}
@keyframes backdropMove{from{transform:scale(1.12) translate3d(-1%,0,0)}to{transform:scale(1.22) translate3d(1%,-1%,0)}}
@keyframes fogDrift{from{transform:translate3d(-4%,2%,0) scale(1)}to{transform:translate3d(5%,-3%,0) scale(1.18)}}
@keyframes gridMove{from{background-position:0 0,0 0}to{background-position:0 68px,0 0}}
@keyframes ringPulse{0%,100%{opacity:.35;scale:.94}50%{opacity:.85;scale:1.04}}
@keyframes scan{from{top:-30%}to{top:110%}}
@media (min-width:700px){.art-frame{width:min(100%,1100px);left:50%;transform:translate(-50%,-50%);animation:arrivalDesktop 3.8s cubic-bezier(.16,1,.3,1) both}.art{animation:slowZoom 22s ease-in-out 3.8s infinite alternate}}
@keyframes arrivalDesktop{0%{opacity:0;filter:blur(22px);transform:translate(-50%,-50%) scale(1.32)}55%{opacity:1;filter:blur(2px)}100%{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}}
@media(prefers-reduced-motion:reduce){.backdrop,.art-frame,.art,.fog,.grid-floor,.ring,.scan{animation:none}}
</style>
</head>
<body>
<main class="world">
  <img class="backdrop" src="./scene.webp" alt="" aria-hidden="true">
  <div class="dimension" aria-hidden="true">
    <div class="grid-floor"></div><div class="ring"></div>
  </div>
  <div class="art-frame">
    <img class="art" src="./scene.webp" alt="A hooded figure inside a glowing green cyber dimension">
  </div>
  <div class="edge-fade"></div>
  <div class="fog"></div>
  <div class="matrix"><canvas id="rain"></canvas></div>
  <div class="scan"></div>
  <div class="vignette"></div>
</main>
<script>
(() => {
 const canvas=document.getElementById('rain'),ctx=canvas.getContext('2d');
 let w=0,h=0,drops=[],font=14,columns=0;
 const chars='01アイウエオカキクケコサシスセソタチツテト<>/{}[]#$%';
 function resize(){
   const dpr=Math.min(window.devicePixelRatio||1,2);
   w=window.innerWidth;h=window.innerHeight;
   canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);
   ctx.setTransform(dpr,0,0,dpr,0,0);
   font=Math.max(12,Math.min(17,w/25));
   columns=Math.ceil(w/(font*1.8));
   drops=Array.from({length:columns},()=>Math.random()*-h/font);
 }
 function draw(){
   ctx.fillStyle='rgba(2,8,5,0.105)';ctx.fillRect(0,0,w,h);
   ctx.font=`${font}px monospace`;
   for(let i=0;i<drops.length;i++){
     const x=i*font*1.8,y=drops[i]*font;
     const ch=chars[Math.floor(Math.random()*chars.length)];
     ctx.fillStyle=Math.random()>.94?'rgba(190,255,200,.95)':'rgba(45,255,95,.52)';
     ctx.shadowColor='#00ff4c';ctx.shadowBlur=7;ctx.fillText(ch,x,y);ctx.shadowBlur=0;
     if(y>h&&Math.random()>.975)drops[i]=Math.random()*-24;
     drops[i]+=.42+Math.random()*.55;
   }
   requestAnimationFrame(draw);
 }
 window.addEventListener('resize',resize,{passive:true});
 resize();draw();
})();
</script>
</body>
</html>
